# Supabase project configuration
# Run `supabase link --project-ref <your-project-ref>` once to set the project reference,
# then apply the schema with `supabase db push`.

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
